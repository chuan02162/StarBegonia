# 分类词表（程序启动/调用时读取本文件；可直接改，改后按部署方式重载或重启生效）
# id 供程序与 Jev 结构化输出使用；改 id 会影响已落库数据，慎改。label 可随时改展示名。

# AA 比例未分满 100% 时，剩余份额归入此名义（如父母出资），不进入成员间再分摊
aa_residual:
  id: family_subsidy
  label: 家庭补贴
  description: 父母出资等不参与成员 AA 的剩余份额

