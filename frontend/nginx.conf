# Docker embedded DNS — re-resolve so recreating `api` does not leave
# nginx stuck on a stale container IP (Connection refused / 502).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $api_host api;
        proxy_pass http://$api_host:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $api_host api;
        proxy_pass http://$api_host:5000/health;
        proxy_set_header Host $host;
    }

    # OpenFeed dashboard jwksUri may point here (also available under /api/v1/sources/…)
    location = /.well-known/jwks.json {
        set $api_host api;
        proxy_pass http://$api_host:5000/api/v1/sources/.well-known/jwks.json;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
