services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: starbegonia
      POSTGRES_PASSWORD: starbegonia
      POSTGRES_DB: starbegonia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starbegonia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: ["gunicorn", "-b", "0.0.0.0:5000", "-w", "2", "wsgi:app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://starbegonia:starbegonia@postgres:5432/starbegonia
      REDIS_URL: redis://redis:6379/0
      CATEGORIES_PATH: /config/categories.yaml
    volumes:
      - ./config:/config:ro
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://starbegonia:starbegonia@postgres:5432/starbegonia
      REDIS_URL: redis://redis:6379/0
      CATEGORIES_PATH: /config/categories.yaml
      # Sydney 00:00 sequential sync; set DAILY_SYNC_ENABLED=0 in .env to disable
      DAILY_SYNC_TZ: Australia/Sydney
      DAILY_SYNC_HOUR: "0"
      DAILY_SYNC_MINUTE: "0"
      DAILY_SYNC_GAP_SECONDS: "45"
      # Only one replica should run the daily scheduler
      DAILY_SYNC_ENABLED: "1"
      RQ_QUEUES: sync
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Second worker so long Jev batches cannot block Coles/OpenFeed sync jobs.
  worker-classify:
    build: ./backend
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://starbegonia:starbegonia@postgres:5432/starbegonia
      REDIS_URL: redis://redis:6379/0
      CATEGORIES_PATH: /config/categories.yaml
      DAILY_SYNC_ENABLED: "0"
      RQ_QUEUES: default
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
