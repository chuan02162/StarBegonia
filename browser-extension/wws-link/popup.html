<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StarBegonia · Woolworths</title>
    <style>
      :root { color-scheme: light; font: 14px system-ui, sans-serif; }
      body { width: 310px; margin: 0; padding: 16px; color: #24302b; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      p { margin: 0 0 12px; color: #66716c; font-size: 12px; line-height: 1.5; }
      textarea { box-sizing: border-box; width: 100%; min-height: 72px; resize: vertical; }
      button { width: 100%; margin-top: 8px; padding: 9px 10px; cursor: pointer; }
      #status { min-height: 18px; margin-top: 10px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <h1>绑定 Woolworths</h1>
    <p>先打开 Woolworths 并登录，再粘贴 StarBegonia 生成的一次性绑定链接。</p>
    <textarea id="pairing" autocomplete="off" spellcheck="false" placeholder="粘贴一次性绑定链接"></textarea>
    <button id="open">打开 Woolworths</button>
    <button id="bind">提取并绑定会话</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
